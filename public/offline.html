<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ゆめいろフレンズ - オフライン</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center;
        font-family: system-ui, -apple-system, 'Hiragino Maru Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; color: #6b4a7a;
        background: linear-gradient(180deg, #ffe4f1, #e9e2ff); }
      h1 { margin: 0 0 12px; color: #e46aa5; }
      p { line-height: 1.8; margin: 0 0 20px; }
      button { min-height: 52px; padding: 10px 28px; border: 0; border-radius: 26px; font: inherit; font-weight: 700; color: #fff; background: #ef7fb4; }
    </style>
  </head>
  <body>
    <main>
      <h1>ゆめいろフレンズ</h1>
      <p>インターネットに つながっていないので、ゲームを よみこめませんでした。<br />
        いちど インターネットに つないで ひらくと、つぎからは オフラインでも あそべます。</p>
      <button type="button" onclick="location.reload()">もういちど よみこむ</button>
    </main>
  </body>
</html>
